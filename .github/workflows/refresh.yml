name: Refresh data

# Reconstruit le site chaque jour (données FRED + HCP + IMF fraîches) et le committe.
# Vercel, connecté au dépôt, redéploie automatiquement au push.
on:
  schedule:
    - cron: "30 6 * * *"      # tous les jours ~06:30 UTC (≈ 07:30 au Maroc)
  workflow_dispatch: {}        # bouton "Run" manuel
  push:
    branches: [ main ]
    paths-ignore: [ "public/**" ]   # évite de se re-déclencher sur son propre commit

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build site
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build.py
      - name: Commit refreshed site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "Aucun changement de données aujourd'hui."
          else
            git commit -m "chore: refresh data [skip ci]"
            git push
          fi
