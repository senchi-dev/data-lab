name: Build & deploy

# Reconstruit le site (données FRED + HCP + IMF fraîches), le committe, et le déploie sur GitHub Pages.
on:
  schedule:
    - cron: "30 6 * * *"      # tous les jours ~06:30 UTC (≈ 07:30 au Maroc)
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths-ignore: [ "public/**" ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build site
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build.py
      - name: Commit refreshed site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public
          git diff --cached --quiet || (git commit -m "chore: refresh data [skip ci]" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
